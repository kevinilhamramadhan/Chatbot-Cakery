# Toti Cakery Chatbot — full stack, satu perintah:
#
#   docker compose up --build -d
#
# Menjalankan 3 container: chatbot, Ollama, wwebjs-api.
# (Backend dipakai dari Vercel, bukan container lokal.)
# Semua saling memanggil lewat nama service di network internal compose.

services:
  chatbot-service:
    build: ./chatbot-service
    container_name: toti-chatbot
    env_file: .env
    environment:
      # Topologi antar-container (menimpa nilai .env):
      WWEBJS_BASE_URL: http://wwebjs-api:3000
      OLLAMA_BASE_URL: http://ollama:11434
      # BACKEND_BASE_URL sengaja TIDAK di-override: backend sekarang dipakai dari
      # deployment Vercel (nilainya di .env), bukan container lokal.
    ports:
      # Bound to localhost as defense in depth. Auth itself is in the app:
      # /webhook/whatsapp/<WEBHOOK_TOKEN> (secret in the path, because
      # wwebjs-api can't send an auth header) and X-Internal-Key on
      # /webhook/internal/*. Both are required at startup.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./chatbot-service/chroma_db:/app/chroma_db      # persistent vector store
      - ./chatbot-service/toti_chatbot.db:/app/toti_chatbot.db
    depends_on:
      - wwebjs-api
      - ollama
    restart: unless-stopped

  # Backend TIDAK lagi dijalankan lokal — dipakai dari deployment Vercel
  # (https://backend-cakery.vercel.app, lihat BACKEND_BASE_URL di .env).
  # Kalau suatu saat perlu backend lokal lagi: clone Backend-Cakery, kembalikan
  # service ini beserta env_file-nya, dan set BACKEND_BASE_URL=http://backend:8001.

  ollama:
    image: ollama/ollama:latest
    container_name: toti-ollama
    environment:
      # Default keep_alive 5m unloads the model after idle — the next customer
      # then pays ~15s of model reload on top of inference. Keep it resident.
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      # Pakai model yang SUDAH ada di host (toti-qwen-1.7b, qwen3-embedding, dll)
      # — tidak perlu pull/import ulang. Host ini CPU-only, jadi tanpa config GPU.
      - /usr/share/ollama/.ollama:/root/.ollama
    restart: unless-stopped
    # Tidak publish port: hanya dipanggil chatbot dari dalam network compose.
    # Kelola model: docker exec -it toti-ollama ollama list

  wwebjs-api:
    image: avoylenko/wwebjs-api:latest
    container_name: toti-wwebjs
    environment:
      ENABLE_WEBHOOK: "true"
      # The token is the webhook's only authentication — keep it in sync with
      # WEBHOOK_TOKEN in .env (compose substitutes it from there).
      BASE_WEBHOOK_URL: http://chatbot-service:8000/webhook/whatsapp/${WEBHOOK_TOKEN:?set WEBHOOK_TOKEN in .env - openssl rand -hex 24}
      API_KEY: ${WWEBJS_API_KEY:?set WWEBJS_API_KEY in .env - openssl rand -hex 24}
      # We only need the `message` event; silence the rest to reduce noise.
      DISABLED_CALLBACKS: "message_create|message_revoke_everyone|message_reaction|media|group_join|group_leave|call"
    ports:
      - "127.0.0.1:3000:3000"   # only needed from this host (QR scan / debug)
    volumes:
      - ./whatsapp-gateway/sessions:/usr/src/app/sessions
    restart: unless-stopped

# Note: Chroma runs embedded inside chatbot-service (PersistentClient) writing to
# the mounted ./chatbot-service/chroma_db volume — no separate container needed.
